
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account | SecureAuth</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="auth-container">
    <section class="auth-card">
      <a href="index.html" class="brand">
        <span class="brand-icon">S</span> SecureAuth
      </a>

      <div class="auth-heading">
        <span class="eyebrow">GET STARTED</span>
        <h1>Create your account</h1>
        <p>Join us by filling in the details below.</p>
      </div>

      <form id="registerForm">
        <label for="registerUsername">Username</label>
        <input type="text" id="registerUsername"
               placeholder="Choose a username"
               autocomplete="username" required minlength="3">

        <label for="registerEmail">Email address</label>
        <input type="email" id="registerEmail"
               placeholder="you@example.com"
               autocomplete="email" required>

        <label for="registerPassword">Password</label>
        <input type="password" id="registerPassword"
               placeholder="At least 8 characters"
               autocomplete="new-password" required minlength="8">

        <p class="hint">Use at least 8 characters and include one number.</p>

        <label for="confirmPassword">Confirm password</label>
        <input type="password" id="confirmPassword"
               placeholder="Re-enter your password"
               autocomplete="new-password" required>

        <p id="registerMessage" class="message" role="alert"></p>

        <button type="submit" class="btn">
          Create Account <span>→</span>
        </button>
      </form>

      <p class="auth-footer">
        Already registered?
        <a href="index.html">Sign in</a>
      </p>

      <p class="security-note">Demo project · Client-side authentication</p>
    </section>
  </main>
</body>
</html>
