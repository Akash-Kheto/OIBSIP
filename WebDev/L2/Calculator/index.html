
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0b0d12">
    <title>Calculator | Premium</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <main class="app">
        <section class="calculator" aria-label="Calculator">

            <header class="top-bar">
                <div class="brand">
                    <div class="brand-icon">∑</div>
                    <div>
                        <h1>Calculator</h1>
                        <p>PRECISION AT YOUR FINGERTIPS</p>
                    </div>
                </div>
                <span class="status-dot" title="Ready"></span>
            </header>

            <section class="display" aria-label="Calculator display">
                <div class="display-label">CURRENT CALCULATION</div>
                <div id="expression" class="expression" aria-live="polite"></div>
                <output id="result" class="result" aria-live="polite"
                    aria-atomic="true">0</output>
            </section>

            <div class="keypad" aria-label="Calculator buttons">
                <button class="key utility" data-action="clear">C</button>
                <button class="key utility" data-action="backspace"
                    aria-label="Backspace">⌫</button>
                <button class="key utility" data-action="percent">%</button>
                <button class="key operator" data-operator="÷"
                    aria-label="Divide">÷</button>

                <button class="key number" data-number="7">7</button>
                <button class="key number" data-number="8">8</button>
                <button class="key number" data-number="9">9</button>
                <button class="key operator" data-operator="×"
                    aria-label="Multiply">×</button>

                <button class="key number" data-number="4">4</button>
                <button class="key number" data-number="5">5</button>
                <button class="key number" data-number="6">6</button>
                <button class="key operator" data-operator="−"
                    aria-label="Subtract">−</button>

                <button class="key number" data-number="1">1</button>
                <button class="key number" data-number="2">2</button>
                <button class="key number" data-number="3">3</button>
                <button class="key operator" data-operator="+"
                    aria-label="Add">+</button>

                <button class="key utility sign" data-action="sign"
                    aria-label="Change sign">±</button>
                <button class="key number" data-number="0">0</button>
                <button class="key number" data-action="decimal">.</button>
                <button class="key equals" data-action="equals"
                    aria-label="Calculate result">=</button>
            </div>

            <footer class="calculator-footer">
                <span><span class="footer-dot"></span> SYSTEM READY</span>
                <span>VANILLA JS · 01</span>
            </footer>
        </section>

        <p class="page-note">A LITTLE LOGIC. A LOT OF PRECISION.</p>
    </main>

</body>
</html>
